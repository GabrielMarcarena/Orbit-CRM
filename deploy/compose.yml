name: orbit

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh}
      TWENTY_DB_PASSWORD: ${TWENTY_DB_PASSWORD:?}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *restart
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    profiles: ["core"]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    <<: *restart
    image: n8nio/n8n:2.43.7@sha256:3db21366be1d3c77c1708963129c051948573019659e8873e0294be035ffc1b2
    profiles: ["core"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_HOST: flows.localhost
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://flows.localhost:${ORBIT_HTTP_PORT}/
      GENERIC_TIMEZONE: Asia/Manila
      TZ: Asia/Manila
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.31.6
    profiles: ["core"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    <<: *restart
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    profiles: ["core"]
    ports:
      - "127.0.0.1:${ORBIT_HTTP_PORT}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80"]
      interval: 10s
      timeout: 5s
      retries: 10

  twenty-server:
    <<: *restart
    image: twentycrm/twenty:v2.48.0@sha256:43fab4bffacdcd63ff3c9257b7f8985a4424d81e9eb43982b9c16a841d555e52
    profiles: ["crm"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment: &twenty-env
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://twenty:${TWENTY_DB_PASSWORD:?}@postgres:5432/twenty
      REDIS_URL: redis://redis:6379
      SERVER_URL: http://crm.localhost:${ORBIT_HTTP_PORT}
      ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY:?}
      STORAGE_TYPE: local
    volumes:
      - twenty-files:/app/packages/twenty-server/.local-storage
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  twenty-worker:
    <<: *restart
    image: twentycrm/twenty:v2.48.0@sha256:43fab4bffacdcd63ff3c9257b7f8985a4424d81e9eb43982b9c16a841d555e52
    profiles: ["crm"]
    command: ["yarn", "worker:prod"]
    depends_on:
      twenty-server: {condition: service_healthy}
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - twenty-files:/app/packages/twenty-server/.local-storage

volumes:
  pg-data:
  redis-data:
  n8n-data:
  caddy-data:
  twenty-files:
